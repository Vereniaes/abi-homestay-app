# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: MONGODB_URI
    secret: MONGODB_URI
    availability:
      - BUILD
      - RUNTIME
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: BLOB_READ_WRITE_TOKEN
    secret: BLOB_READ_WRITE_TOKEN
    availability:
      - BUILD
      - RUNTIME
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME
  - variable: BREVO_SENDER_EMAIL
    value: "abedenstein12@gmail.com"
    availability:
      - RUNTIME
  - variable: BREVO_SENDER_NAME
    value: "ABI Homestay Reminder"
    availability:
      - RUNTIME
  - variable: REMINDER_RECIPIENT_EMAIL
    value: "titasaripratiwi8@gmail.com"
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
